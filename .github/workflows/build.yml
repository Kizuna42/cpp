name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-all:
    name: build all exercises (${{ matrix.cxx }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v5
      - name: Build every exercise with -Wall -Wextra -Werror -std=c++98
        run: |
          status=0
          for dir in cpp0*/ex*; do
            if make -C "$dir" CXX=${{ matrix.cxx }} >/dev/null; then
              echo "OK   $dir"
            else
              echo "FAIL $dir"
              status=1
            fi
            make -C "$dir" fclean >/dev/null
          done
          exit $status

  cpp09-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Regression tests
        run: python3 scripts/verify_cpp09.py --quick
      - name: Regression tests with ASan/UBSan
        run: python3 scripts/verify_cpp09.py --sanitize --quick

  cpp00-04-verify:
    name: cpp00-04 output and valgrind checks (${{ matrix.cxx }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v5
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Build, compare with subject examples, and run valgrind
        env:
          CXX: ${{ matrix.cxx }}
        run: bash scripts/verify_cpp00_04.sh

  cpp05-09-verify:
    name: cpp05-09 verification suite (verify_cpp05_09.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Build and test cpp05-cpp09
        run: bash scripts/verify_cpp05_09.sh
