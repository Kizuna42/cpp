name: verify

on:
  push:
  pull_request:

jobs:
  cpp05-09:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Build and test cpp05-cpp09
        run: bash scripts/verify_cpp05_09.sh
